name: CV PDF

# D14: print /cv to PDF with Playwright and publish it as a rolling GitHub Release
# asset (tag cv-latest). The site links to that stable URL. Nothing is committed.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/content/resume.yaml"
      - "apps/web/app/cv/**"
      - "apps/web/app/globals.css"
      - "apps/web/app/fonts/**"
      - "apps/web/scripts/print-cv.mjs"
      - ".github/workflows/cv-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cv-pdf
  cancel-in-progress: true

jobs:
  pdf:
    name: Print /cv to PDF and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install Playwright (not a project dependency)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start the production server
        run: |
          npm start &
          npx --yes wait-on@8.0.4 http://localhost:3000/cv --timeout 60000
      - name: Print
        run: node scripts/print-cv.mjs http://localhost:3000/cv out/Mohamed-Ibrahim-CV.pdf
      - name: Publish as rolling release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view cv-latest >/dev/null 2>&1 || \
            gh release create cv-latest --title "CV (latest)" \
              --notes "Rebuilt automatically from apps/web/content/resume.yaml on every change." --latest=false
          gh release upload cv-latest out/Mohamed-Ibrahim-CV.pdf --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: apps/web/out/Mohamed-Ibrahim-CV.pdf
