name: Lighthouse

# D25: runs against a local production build, not the Vercel preview, so the
# result does not depend on deploy timing. Mobile preset, 3 runs, median scored.
# Fails the PR when mobile Performance drops below 85 (CLAUDE.md quality bar).

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/lighthouse.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse (mobile, local build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
